# 5 GHz AP – WPA3-SAE, Wi-Fi 7 (802.11be/EHT), 80 MHz, channel 36 (no DFS)
interface=@AP_IFACE@
driver=nl80211
ctrl_interface=/run/hostapd
ctrl_interface_group=0

ssid=@AP_SSID@
country_code=@COUNTRY@
ieee80211d=1
ignore_broadcast_ssid=0

hw_mode=a
channel=36
op_class=128
ieee80211n=1
ieee80211ac=1
ieee80211ax=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42
he_oper_chwidth=1
he_oper_centr_freq_seg0_idx=42
ieee80211be=1
eht_oper_chwidth=1
eht_oper_centr_freq_seg0_idx=42
wmm_enabled=1

# --- security (setup.sh removes this block when AP_OPEN_5G=1) ---
auth_algs=1
wpa=2
wpa_key_mgmt=SAE
wpa_passphrase=@AP_PASS@
rsn_pairwise=CCMP
ieee80211w=2
sae_require_mfp=1
sae_pwe=2
