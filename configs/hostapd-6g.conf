# 6 GHz AP – WPA3-SAE (H2E), Wi-Fi 7 (802.11be/EHT), 160 MHz
# 6 GHz allows SAE + PMF only, and SAE hash-to-element (sae_pwe) is mandatory –
# without it clients just report "connection failed".
interface=@AP_IFACE@
driver=nl80211
ctrl_interface=/run/hostapd
ctrl_interface_group=0

ssid=@AP_SSID@-6g
country_code=@COUNTRY@
ieee80211d=1
ignore_broadcast_ssid=0

hw_mode=a
channel=37
op_class=134
ieee80211n=1
ieee80211ax=1
he_oper_chwidth=2
he_oper_centr_freq_seg0_idx=47
ieee80211be=1
eht_oper_chwidth=2
eht_oper_centr_freq_seg0_idx=47
wmm_enabled=1

auth_algs=1
wpa=2
wpa_key_mgmt=SAE
wpa_passphrase=@AP_PASS@
rsn_pairwise=CCMP
ieee80211w=2
sae_require_mfp=1
sae_pwe=2
beacon_prot=1
